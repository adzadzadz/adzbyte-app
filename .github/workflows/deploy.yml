name: Release to Hostinger
run-name: ${{ inputs.command }} ${{ inputs.scope }} to Hostinger

on:
  workflow_dispatch:
    inputs:
      command:
        description: Explicit production authorization
        required: true
        type: choice
        options:
          - release
          - deploy

      scope:
        description: Reviewed source scope
        required: true
        type: choice
        default: main
        options:
          - main
          - qrph-package
      expected_source_sha:
        description: Full independently reviewed commit SHA (required for qrph-package)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  authorize:
    name: Confirm release directive
    runs-on: ubuntu-24.04
    timeout-minutes: 2

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Accept only release or deploy
        env:
          RELEASE_COMMAND: ${{ inputs.command }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SCOPE: ${{ inputs.scope }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          case "$RELEASE_COMMAND" in
            release|deploy) ;;
            *) exit 1 ;;
          esac

          if [[ "$RELEASE_SCOPE" == "qrph-package" ]]; then
            [[ "$RELEASE_REF" == "refs/heads/codex/qrph-package-checkout" ]]
            [[ "$EXPECTED_SOURCE_SHA" == "$SOURCE_SHA" ]]
            bash scripts/verify-package-release.sh "$SOURCE_SHA"
            git fetch origin deploy:refs/remotes/origin/deploy
            [[ "$(git rev-parse origin/deploy)" == "a5d9e3c3d7a214768f129e5c93fbd3705db94b9b" ]]
          else
            [[ "$RELEASE_SCOPE" == "main" && "$RELEASE_REF" == "refs/heads/main" ]]
          fi

  verify:
    name: Verify release
    needs: authorize
    uses: ./.github/workflows/ci.yml
    with:
      upload_assets: true

  promote:
    name: Promote to deploy branch
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
      url: https://app.adzbyte.com
    permissions:
      contents: write

    steps:
      - name: Check out source history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Prepare deploy branch
        env:
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_SCOPE: ${{ inputs.scope }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin deploy; then
            git fetch origin deploy:refs/remotes/origin/deploy
            if [[ "$RELEASE_SCOPE" == "qrph-package" ]]; then
              bash scripts/verify-package-release.sh "$SOURCE_SHA"
              [[ "$(git rev-parse origin/deploy)" == "a5d9e3c3d7a214768f129e5c93fbd3705db94b9b" ]]
            fi
            git switch --create deploy --track origin/deploy
            git merge --no-commit --no-ff "$SOURCE_SHA"
          else
            [[ "$RELEASE_SCOPE" == "main" ]]
            git switch --create deploy "$SOURCE_SHA"
          fi

          git rm -r --ignore-unmatch public/build

      - name: Download verified production assets
        uses: actions/download-artifact@v7
        with:
          name: production-assets-${{ github.sha }}
          path: public/build

      - name: Publish deploy branch
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git add --force public/build
          git commit --allow-empty --message "Deploy ${SOURCE_SHA::12}"
          git push origin deploy
