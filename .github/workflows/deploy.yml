name: Release to Hostinger
run-name: ${{ inputs.command }} ${{ inputs.scope }} to Hostinger

on:
  workflow_dispatch:
    inputs:
      command:
        description: Explicit production authorization
        required: true
        type: choice
        options:
          - release
          - deploy

      scope:
        description: Reviewed source scope (main only)
        required: true
        type: choice
        default: main
        options:
          - main
      expected_source_sha:
        description: Optional full reviewed main commit SHA to pin the release
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  authorize:
    name: Confirm release directive
    runs-on: ubuntu-24.04
    timeout-minutes: 2

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Accept only release or deploy
        env:
          RELEASE_COMMAND: ${{ inputs.command }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SCOPE: ${{ inputs.scope }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          case "$RELEASE_COMMAND" in
            release|deploy) ;;
            *) exit 1 ;;
          esac

          [[ "$RELEASE_SCOPE" == "main" && "$RELEASE_REF" == "refs/heads/main" ]]
          if [[ -n "$EXPECTED_SOURCE_SHA" ]]; then
            [[ "$EXPECTED_SOURCE_SHA" =~ ^[a-f0-9]{40}$ && "$EXPECTED_SOURCE_SHA" == "$SOURCE_SHA" ]]
          fi

  verify:
    name: Verify release
    needs: authorize
    uses: ./.github/workflows/ci.yml
    with:
      upload_assets: true

  promote:
    name: Deploy and verify production
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: production
      url: https://app.adzbyte.com
    permissions:
      contents: write

    env:
      SSH_HOST: 151.106.116.157
      SSH_PORT: '65002'
      SSH_USER: u463458285
      SOURCE_SHA: ${{ github.sha }}

    steps:
      - name: Check out source history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify deployment access before publishing
        env:
          AUTOMATION_READY: ${{ vars.HOSTINGER_SSH_AUTOMATION_READY }}
          DEPLOY_KEY: ${{ secrets.HOSTINGER_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$AUTOMATION_READY" == "true" && -n "$DEPLOY_KEY" && -n "$KNOWN_HOSTS" ]] || {
            echo 'Complete the one-time restricted SSH setup and disable Hostinger auto-deployment first.' >&2
            exit 1
          }
          umask 077
          mkdir -p "$RUNNER_TEMP/adzbyte-ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/adzbyte-ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/adzbyte-ssh/known_hosts"
          ssh -F /dev/null -i "$RUNNER_TEMP/adzbyte-ssh/key" -p "$SSH_PORT" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -o UserKnownHostsFile="$RUNNER_TEMP/adzbyte-ssh/known_hosts" \
            "$SSH_USER@$SSH_HOST" preflight
          git fetch origin main:refs/remotes/origin/main
          [[ "$(git rev-parse origin/main)" == "$SOURCE_SHA" ]] || {
            echo 'main moved during verification. Start a newly authorized release of the current source.' >&2
            exit 1
          }

      - name: Prepare deploy branch
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin deploy; then
            git fetch origin deploy:refs/remotes/origin/deploy
            git switch --create deploy --track origin/deploy
            git merge --no-commit --no-ff "$SOURCE_SHA"
          else
            git switch --create deploy "$SOURCE_SHA"
          fi

          git rm -r --ignore-unmatch public/build

      - name: Download verified production assets
        uses: actions/download-artifact@v7
        with:
          name: production-assets-${{ github.sha }}
          path: public/build

      - name: Publish deploy branch
        id: publish
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git add --force public/build
          git commit --allow-empty --message "Deploy ${SOURCE_SHA::12}"
          git push origin deploy
          echo "deploy_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run protected server deployment
        env:
          DEPLOY_SHA: ${{ steps.publish.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          ssh -F /dev/null -i "$RUNNER_TEMP/adzbyte-ssh/key" -p "$SSH_PORT" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            -o UserKnownHostsFile="$RUNNER_TEMP/adzbyte-ssh/known_hosts" \
            "$SSH_USER@$SSH_HOST" "deploy $SOURCE_SHA $DEPLOY_SHA"

      - name: Verify public HTTPS from the runner
        run: bash scripts/deployment/http-check.sh https://app.adzbyte.com

      - name: Record verified release
        env:
          DEPLOY_SHA: ${{ steps.publish.outputs.deploy_sha }}
        run: |
          {
            echo '### Production verified'
            echo "Source: \`$SOURCE_SHA\`"
            echo "Deploy: \`$DEPLOY_SHA\`"
            echo 'Protected database backup, environment preservation, locked deployment, migrations, caches, worker restart and HTTPS checks passed.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary SSH credentials
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/adzbyte-ssh"
