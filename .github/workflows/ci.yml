name: CI

on:
  workflow_call:
    inputs:
      upload_assets:
        description: Save verified production assets for a release workflow
        required: false
        type: boolean
        default: false
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mbstring, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Prepare application environment
        run: cp .env.example .env

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate CI application key
        run: php artisan key:generate --ansi

      - name: Audit PHP dependencies
        run: composer audit --locked --no-interaction

      - name: Check PHP formatting
        run: vendor/bin/pint --test

      - name: Run PHP tests
        run: composer test

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Build production assets
        run: npm run build

      - name: Verify Laravel production caches
        run: php artisan optimize

      - name: Save production assets
        if: inputs.upload_assets
        uses: actions/upload-artifact@v7
        with:
          name: production-assets-${{ github.sha }}
          path: public/build
          if-no-files-found: error
          retention-days: 1
